[project]
name = "dante-x-engine"
version = "0.1.0"
description = "Deterministic market intelligence engine for Dante X"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "upstox-python-sdk",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.7,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["I001", "UP017", "BLE001", "S110", "S112", "DTZ011", "FURB162", "RUF007"]
