name: pre-app-audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "services/engine[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: python -m dantex.pre_app_audit --output audit-results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-app-audit
          path: audit-results/ci
