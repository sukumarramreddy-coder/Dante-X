name: engine-ci

on:
  push:
    paths:
      - "services/engine/**"
      - ".github/workflows/engine-ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/engine/**"
      - ".github/workflows/engine-ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - ".env.example"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dantex-qc .
      - name: Container health smoke test (no provider credentials)
        run: |
          docker run -d --name dantex-qc -p 8000:8000 dantex-qc
          trap 'docker logs dantex-qc; docker rm -f dantex-qc' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health > health.json; then break; fi
            sleep 2
          done
          python -c 'import json; h=json.load(open("health.json")); assert h["service"] == "dante-x-engine"; assert h["live_data"]["eligible"] is False'
