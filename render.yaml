services:
  - type: web
    name: dante-x-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DANTEX_MODE
        value: shadow
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: DANTEX_VALIDATION_DB
        value: /tmp/dantex-validation.sqlite3
